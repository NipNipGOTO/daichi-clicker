<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>大地クリッカー</title>

<style>
body {
  margin: 0;
  background: url("https://i.imgur.com/o2WgAe5.png") no-repeat center center fixed;
  background-size: cover;
  color: #fff;
  font-family: 'Segoe UI', sans-serif;
}

body::before {
  content: "";
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.5);
  backdrop-filter: blur(6px);
  z-index: 0;
}

.container {
  max-width: 900px;
  margin: 20px auto;
  padding: 10px;
  position: relative;
  z-index: 1;
  background: rgba(0,0,0,0.6);
  border-radius: 16px;
}

.header {
  text-align: center;
  background: rgba(20,20,20,0.8);
  padding: 10px;
  border-radius: 12px;
}

.main {
  display: flex;
}

.left {
  flex: 1;
  display: flex;
  justify-content: center;
  align-items: center;
}

#cookieImg {
  width: 250px;
  cursor: pointer;
  transition: 0.1s;
}

#cookieImg:active {
  transform: scale(0.9);
}

.right {
  width: 280px;
}

.right button {
  width: 100%;
  margin: 5px 0;
  padding: 12px;
  background: #333;
  color: white;
  border: none;
  border-radius: 10px;
}

.number-pop {
  position: fixed;
  color: gold;
  font-weight: bold;
  animation: pop 0.8s forwards;
}

@keyframes pop {
  to { transform: translateY(-50px); opacity: 0; }
}

.combo {
  position: fixed;
  top: 20%;
  left: 50%;
  transform: translateX(-50%);
  color: red;
  font-size: 24px;
}
</style>
</head>

<body>

<div class="container">

  <div class="header">
    <h2><span id="cookies">0</span> 大地</h2>
    <p>毎秒: <span id="cps">0</span></p>
  </div>

  <div class="main">
    <div class="left">
      <img id="cookieImg" src="https://i.imgur.com/lIClgEd.png">
    </div>

    <div class="right">
      <button onclick="buy('cursor',1,1.2)">カーソル <span id="cost_cursor"></span></button>
      <button onclick="buy('grandma',5,1.25)">ごとひなた <span id="cost_grandma"></span></button>
      <button onclick="buy('factory',20,1.3)">工場 <span id="cost_factory"></span></button>
      <button onclick="buy('click',1,1.5)">クリック強化 <span id="cost_click"></span></button>
    </div>
  </div>

</div>

<script>
const CLICK_SOUND_URL = "https://raw.githubusercontent.com/NipNipGOTO/GOTOMP3/main/%E3%81%82%EF%BD%9E%EF%BC%81.mp3";
const BGM_URL = "https://raw.githubusercontent.com/NipNipGOTO/GOTOMP3/main/%E3%81%94%E3%81%A8%E3%81%86%E3%81%A0%E3%81%84%E3%81%A1%E3%81%AE%E9%83%A8%E5%B1%8B%20(1).mp3";

const bgm = new Audio(BGM_URL);
bgm.loop = true;
bgm.volume = 0.2;

let bgmStarted = false;

let data = {
  cookies: 0,
  cps: 0,
  clickPower: 1,
  costs: { cursor: 10, grandma: 50, factory: 200, click: 100 }
};

const cookieImg = document.getElementById("cookieImg");
const cookiesEl = document.getElementById("cookies");
const cpsEl = document.getElementById("cps");

const costCursorEl = document.getElementById("cost_cursor");
const costGrandmaEl = document.getElementById("cost_grandma");
const costFactoryEl = document.getElementById("cost_factory");
const costClickEl = document.getElementById("cost_click");

let combo = 0;
let comboTimer;
const comboEl = document.createElement("div");
comboEl.className = "combo";
document.body.appendChild(comboEl);

function playClick(){
  const s=new Audio(CLICK_SOUND_URL);
  s.volume=0.3;
  s.play();
}

function updateUI(){
  cookiesEl.textContent=Math.floor(data.cookies);
  cpsEl.textContent=data.cps;

  costCursorEl.textContent=data.costs.cursor;
  costGrandmaEl.textContent=data.costs.grandma;
  costFactoryEl.textContent=data.costs.factory;
  costClickEl.textContent=data.costs.click;
}

function pop(x,y,val){
  const el=document.createElement("div");
  el.className="number-pop";
  el.textContent="+"+val;
  el.style.left=x+"px";
  el.style.top=y+"px";
  document.body.appendChild(el);
  setTimeout(()=>el.remove(),800);
}

cookieImg.onclick=(e)=>{
  combo++;
  comboEl.textContent=combo+" COMBO";

  clearTimeout(comboTimer);
  comboTimer=setTimeout(()=>{
    combo=0;
    comboEl.textContent="";
  },1500);

  const gain=Math.floor(data.clickPower*(1+combo*0.1));
  data.cookies+=gain;

  pop(e.clientX,e.clientY,gain);

  if(!bgmStarted){
    bgm.play();
    bgmStarted=true;
  }

  playClick();
  updateUI();
};

window.buy=function(type,gain,rate){
  let cost=data.costs[type];

  if(data.cookies>=cost){
    data.cookies-=cost;

    if(type==="click"){data.clickPower+=gain;}
    else{data.cps+=gain;}

    data.costs[type]=Math.floor(cost*rate);
    updateUI();
  }
};

setInterval(()=>{
  data.cookies+=data.cps/10;
  updateUI();
},100);

updateUI();
</script>

</body>
</html>
