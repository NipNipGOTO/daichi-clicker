<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>大地クリッカー</title>

<style>
body {
  margin: 0;
  background: url("https://i.imgur.com/o2WgAe5.png") no-repeat center center fixed;
  background-size: cover;
  color: #fff;
  font-family: sans-serif;
}

.container {
  max-width: 900px;
  margin: 20px auto;
  padding: 10px;
  background: rgba(0,0,0,0.6);
  border-radius: 10px;
}

.main {
  display: flex;
}

.left {
  flex: 1;
  text-align: center;
}

#cookieImg {
  width: 200px;
  cursor: pointer;
}

.right {
  width: 250px;
}

button {
  width: 100%;
  margin: 5px 0;
  padding: 10px;
}
</style>
</head>

<body>

<div class="container">
  <h2><span id="cookies">0</span> 大地</h2>
  <p>毎秒: <span id="cps">0</span></p>
  <p>倍率: x<span id="multiplier">1</span></p>

  <div class="main">
    <div class="left">
      <img id="cookieImg" src="https://i.imgur.com/lIClgEd.png">
    </div>

    <div class="right">
      <button onclick="buy('cursor',1,1.2)">カーソル <span id="cost_cursor"></span></button>
      <button onclick="buy('grandma',5,1.25)">ごとひなた <span id="cost_grandma"></span></button>
      <button onclick="buy('factory',20,1.3)">工場 <span id="cost_factory"></span></button>
      <button onclick="buy('click',1,1.5)">クリック強化 <span id="cost_click"></span></button>

      <hr>
      <button id="rebirthBtn">転生（1000）</button>
    </div>
  </div>
</div>

<script>
// ===== 音 =====
const CLICK_SOUND = "https://raw.githubusercontent.com/NipNipGOTO/GOTOMP3/main/%E3%81%82%EF%BD%9E%EF%BC%81.mp3";
const BGM = "https://raw.githubusercontent.com/NipNipGOTO/GOTOMP3/main/%E3%81%94%E3%81%A8%E3%81%86%E3%81%A0%E3%81%84%E3%81%A1%E3%81%AE%E9%83%A8%E5%B1%8B%20(1).mp3";

const bgm = new Audio(BGM);
bgm.loop = true;
bgm.volume = 0.2;

function playClick(){
  const s = new Audio(CLICK_SOUND);
  s.volume = 0.2;
  s.play();
}

// ===== セーブ =====
let data = JSON.parse(localStorage.getItem("save")) || {
  cookies: 0,
  cps: 0,
  clickPower: 1,
  multiplier: 1,
  costs: { cursor:10, grandma:50, factory:200, click:100 }
};

// ===== 要素 =====
const cookieImg = document.getElementById("cookieImg");
const cookiesEl = document.getElementById("cookies");
const cpsEl = document.getElementById("cps");
const multiplierEl = document.getElementById("multiplier");
const rebirthBtn = document.getElementById("rebirthBtn");

const costCursorEl = document.getElementById("cost_cursor");
const costGrandmaEl = document.getElementById("cost_grandma");
const costFactoryEl = document.getElementById("cost_factory");
const costClickEl = document.getElementById("cost_click");

// ===== UI =====
function updateUI(){
  cookiesEl.textContent = Math.floor(data.cookies);
  cpsEl.textContent = data.cps;
  multiplierEl.textContent = data.multiplier;

  costCursorEl.textContent = data.costs.cursor;
  costGrandmaEl.textContent = data.costs.grandma;
  costFactoryEl.textContent = data.costs.factory;
  costClickEl.textContent = data.costs.click;
}

// ===== セーブ保存 =====
setInterval(()=>{
  localStorage.setItem("save", JSON.stringify(data));
},3000);

// ===== クリック =====
let started = false;

cookieImg.onclick = ()=>{
  data.cookies += data.clickPower * data.multiplier;

  playClick();

  if(!started){
    bgm.play();
    started = true;
  }

  updateUI();
};

// ===== 購入 =====
window.buy = function(type,gain,rate){
  let cost = data.costs[type];

  if(data.cookies >= cost){
    data.cookies -= cost;

    if(type==="click") data.clickPower += gain;
    else data.cps += gain;

    data.costs[type] = Math.floor(cost * rate);
    updateUI();
  }
};

// ===== 転生 =====
rebirthBtn.onclick = ()=>{
  if(data.cookies < 1000){
    alert("足りない！");
    return;
  }

  data.multiplier += 1;
  data.cookies = 0;
  data.cps = 0;
  data.clickPower = 1;

  alert("転生！倍率アップ！");
  updateUI();
};

// ===== 自動収入 =====
setInterval(()=>{
  data.cookies += (data.cps * data.multiplier)/10;
  updateUI();
},100);

// 初期化
updateUI();
</script>

</body>
</html>
